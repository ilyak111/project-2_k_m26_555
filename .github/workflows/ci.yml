name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: make install
      - name: Check style
        run: make lint
      - name: Run tests
        run: make test
      - name: Build package
        run: make build
      - name: Check metadata
        run: uvx twine check dist/*
